name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # macOS: the engine wheels (onnxruntime, sherpa-onnx, kokoro-onnx, openwakeword) all
    # install there; openwakeword pulls tflite-runtime on Linux, which has no wheel for
    # Python 3.12. No models are downloaded: the tests use fake engines.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Ruff
        run: |
          uv run ruff check
          uv run ruff format --check
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest
